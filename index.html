<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YBYF Juniors Game Day Soundboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, Helvetica, sans-serif;
    background: #071b3c;
    color: white;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
}

.header h2 {
    margin: 5px 0;
    font-size: 20px;
}

.header p {
    margin-top: 8px;
    opacity: 0.8;
}


/* NOW PLAYING */

.now-playing {
    background: white;
    color: #071b3c;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 20px;
    text-align: center;
}

.now-playing-label {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    opacity: .7;
}

#nowPlaying {
    font-size: 18px;
    font-weight: bold;
    margin-top: 7px;
}


/* PROGRESS BAR */

.progress-container {
    width: 100%;
    height: 9px;
    background: #d6d6d6;
    border-radius: 10px;
    margin-top: 15px;
    overflow: hidden;
}

#progressBar {
    width: 0%;
    height: 100%;
    background: #0b3d91;
}

.time {
    font-size: 12px;
    margin-top: 8px;
}


/* CONTROLS */

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 25px;
}

.control-button {
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.pause,
.restart {
    background: white;
    color: #071b3c;
}


/* SECTIONS */

.section {
    background: white;
    color: #071b3c;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
}

.section-title {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 15px;
}


/* SONG BUTTONS */

.song-button {
    width: 100%;
    border: none;
    border-radius: 12px;
    background: #0b3d91;
    color: white;
    padding: 20px;
    margin-bottom: 11px;
    text-align: left;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.song-button:active {
    transform: scale(.98);
}

.song-name {
    display: block;
}

.song-description {
    display: block;
    font-size: 12px;
    margin-top: 5px;
    opacity: .75;
}


/* STOP */

.stop-button {
    width: 100%;
    border: none;
    border-radius: 14px;
    background: #c62828;
    color: white;
    padding: 22px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 30px;
}

.stop-button:active {
    transform: scale(.98);
}


/* FOOTER */

.footer {
    text-align: center;
    font-size: 12px;
    opacity: .6;
    padding-bottom: 20px;
}

</style>
</head>


<body>

<div class="container">


<!-- HEADER -->

<div class="header">

<h1>🏈 YOSEMITE BADGERS</h1>

<h2>JUNIORS</h2>

<p>2026 GAME DAY SOUNDBOARD</p>

</div>



<!-- NOW PLAYING -->

<div class="now-playing">

<div class="now-playing-label">
NOW PLAYING
</div>

<div id="nowPlaying">
Nothing Playing
</div>

<div class="progress-container">
<div id="progressBar"></div>
</div>

<div class="time">
<span id="currentTime">0:00</span>
•
<span id="duration">0:00</span>
</div>

</div>



<!-- CONTROLS -->

<div class="controls">

<button
class="control-button pause"
onclick="pauseMusic()">
⏸ PAUSE / RESUME
</button>

<button
class="control-button restart"
onclick="restartMusic()">
↺ RESTART
</button>

</div>



<!-- HALFTIME -->

<div class="section">

<div class="section-title">
💃 HALFTIME
</div>

<button
class="song-button"
onclick="playSong(
'music/YBYF Juniors Game 1 Halftime 2026.mp3',
'Game 1 Halftime'
)">

<span class="song-name">
▶ GAME 1 — HALFTIME
</span>

<span class="song-description">
YBYF Juniors • 2026
</span>

</button>

</div>



<!-- FIGHT SONG -->

<div class="section">

<div class="section-title">
🏈 FIGHT SONG
</div>

<button
class="song-button"
onclick="playSong(
'music/Fight Song.mp3',
'Yosemite Fight Song'
)">

<span class="song-name">
▶ FIGHT SONG
</span>

<span class="song-description">
Yosemite Badgers
</span>

</button>

</div>



<!-- SIDELINE -->

<div class="section">

<div class="section-title">
📣 SIDELINE MUSIC
</div>


<button
class="song-button"
onclick="playSong(
'music/Sideline Hollywood.mp3',
'Hollywood'
)">

<span class="song-name">
▶ HOLLYWOOD
</span>

<span class="song-description">
Sideline
</span>

</button>



<button
class="song-button"
onclick="playSong(
'music/Sideline Get Silly.mp3',
'Get Silly'
)">

<span class="song-name">
▶ GET SILLY
</span>

<span class="song-description">
Sideline
</span>

</button>



<button
class="song-button"
onclick="playSong(
'music/Sideline Brass.mp3',
'Brass'
)">

<span class="song-name">
▶ BRASS
</span>

<span class="song-description">
Sideline
</span>

</button>



<button
class="song-button"
onclick="playSong(
'music/YBYC Seniors Hot to go 2.mp3',
'Hot To Go'
)">

<span class="song-name">
▶ HOT TO GO
</span>

<span class="song-description">
Sideline
</span>

</button>


</div>



<!-- STOP -->

<button
class="stop-button"
onclick="stopMusic()">

⏹ STOP ALL MUSIC

</button>



<div class="footer">

YBYF JUNIORS • YOSEMITE BADGERS • 2026

</div>

</div>



<script>

let currentAudio = null;
let currentSong = "";



function playSong(file, title) {

    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }

    currentAudio = new Audio(file);

    currentSong = title;

    currentAudio.play();

    document.getElementById("nowPlaying").innerHTML =
    "🎵 " + title;


    currentAudio.addEventListener("loadedmetadata", function() {

        document.getElementById("duration").innerHTML =
        formatTime(currentAudio.duration);

    });


    currentAudio.addEventListener("timeupdate", function() {

        let percentage =
        (currentAudio.currentTime / currentAudio.duration) * 100;

        document.getElementById("progressBar").style.width =
        percentage + "%";

        document.getElementById("currentTime").innerHTML =
        formatTime(currentAudio.currentTime);

    });


    currentAudio.addEventListener("ended", function() {

        document.getElementById("nowPlaying").innerHTML =
        "Nothing Playing";

        document.getElementById("progressBar").style.width =
        "0%";

        document.getElementById("currentTime").innerHTML =
        "0:00";

    });

}



function pauseMusic() {

    if (!currentAudio) {
        return;
    }

    if (currentAudio.paused) {

        currentAudio.play();

        document.getElementById("nowPlaying").innerHTML =
        "🎵 " + currentSong;

    }

    else {

        currentAudio.pause();

        document.getElementById("nowPlaying").innerHTML =
        "⏸ " + currentSong;

    }

}



function restartMusic() {

    if (!currentAudio) {
        return;
    }

    currentAudio.currentTime = 0;

    currentAudio.play();

    document.getElementById("nowPlaying").innerHTML =
    "🎵 " + currentSong;

}



function stopMusic() {

    if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime = 0;

    }

    document.getElementById("nowPlaying").innerHTML =
    "Nothing Playing";

    document.getElementById("progressBar").style.width =
    "0%";

    document.getElementById("currentTime").innerHTML =
    "0:00";

    document.getElementById("duration").innerHTML =
    "0:00";

}



function formatTime(seconds) {

    if (isNaN(seconds)) {
        return "0:00";
    }

    let minutes = Math.floor(seconds / 60);

    let secs = Math.floor(seconds % 60);

    if (secs < 10) {
        secs = "0" + secs;
    }

    return minutes + ":" + secs;

}

</script>


</body>
</html>
